[project]
name = "frugal-flows"
version = "0.2.0"
description = "Frugal flows: causal generative models with a directly parametrised causal margin, in JAX."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Laura Battaglia", email = "battaglia@stats.ox.ac.uk"},
  {name = "Daniel de Vassimon Manela", email = "manela@stats.ox.ac.uk"},
]
keywords = ["jax", "copula", "causal-inference", "deep-learning", "frugal-parametrisation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
urls = {repository = "https://github.com/llaurabat91/deep-copula-frugal" }
# flowjax is pinned: the package imports private flowjax symbols (_StandardUniform,
# _add_default_permute) and the spline parameter count changed between releases.
dependencies = ["jax>=0.7", "flowjax==19.1.0", "equinox>=0.11", "paramax>=0.0.5", "jaxtyping",
                "optax", "numpy", "scipy", "pandas", "tqdm"]

[project.optional-dependencies]
# the MorphoMNIST validation runners, baselines and plots
validation = ["torch", "torchvision", "matplotlib", "scikit-learn", "wandb"]
# benchmark-style realism (FID) of generated images
fid = ["torchmetrics", "torch-fidelity"]
test = ["pytest"]


[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frugal_flows*"]
exclude = ["tests", "tests.*", "examples"]

[tool.ruff]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E501",  "E721", "E731", "E741", "F722", "F811"]
select = ["E", "F", "I001"]
